# Builds the Nintendo 3DS homebrew port (3ds/) into OurSpringHours.3dsx and uploads it as an artifact.
# Run it from the Actions tab ("Run workflow") or push a change under 3ds/ / assets/.
name: Build 3DS homebrew
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    paths: ["3ds/**", "assets/**", "js/**", ".github/workflows/build-3ds.yml"]
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pip install pillow
      - name: Story bundle + 3DS-sized pictures
        run: |
          node 3ds/tools/bundle_story.js
          python3 3ds/tools/build_assets.py 3ds/build/gfx
      - name: Headless playtest of the story runtime
        run: node 3ds/tools/rt_playtest.js 10
      - uses: actions/upload-artifact@v4
        with:
          name: 3ds-assets
          path: |
            3ds/romfs/story.js
            3ds/build/gfx/*.png
  build:
    needs: assets
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: 3ds-assets, path: assets-dl }
      - name: Install 3DS libraries
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm 3ds-dev
      - name: Place assets + convert pictures to 3DS textures
        run: |
          mkdir -p 3ds/romfs/gfx
          find assets-dl -name story.js -exec cp {} 3ds/romfs/story.js \;
          for f in $(find assets-dl -name '*.png'); do
            n=$(basename "$f" .png)
            case "$n" in bg_*) fmt=rgb565;; *) fmt=rgba8888;; esac
            tex3ds -f $fmt -z auto -o 3ds/romfs/gfx/$n.t3x "$f"
          done
          ls 3ds/romfs/gfx | wc -l
      - name: Build
        working-directory: 3ds
        run: make -j2
      - uses: actions/upload-artifact@v4
        with:
          name: OurSpringHours-3dsx
          path: |
            3ds/OurSpringHours.3dsx
            3ds/OurSpringHours.smdh
      - name: Size check
        run: ls -l 3ds/OurSpringHours.3dsx
      - name: Publish to the "3ds-latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 3ds-latest
          name: 3DS build (latest)
          prerelease: true
          body: "Automatic build of the 3DS homebrew port. Copy OurSpringHours.3dsx to the `3ds/` folder on your SD card. See 3ds/README.md."
          files: |
            3ds/OurSpringHours.3dsx
