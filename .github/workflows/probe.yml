name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for r in diasurgical/bannertool carstene1ns/3ds-bannertool Mtgxyz/bannertool; do
            echo "=== $r releases"; curl -sSL "https://api.github.com/repos/$r/releases" | grep -o '"browser_download_url": *"[^"]*"' | head -6
            echo "--- tree"; curl -sSL "https://api.github.com/repos/$r/contents/" | grep -o '"name": *"[^"]*"' | tr '\n' ' '; echo
            echo "--- readme"; curl -sSL "https://raw.githubusercontent.com/$r/master/README.md" | head -30
          done
