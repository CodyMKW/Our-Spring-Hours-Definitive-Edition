# Builds the Nintendo DS port (nds/) with BlocksDS into OurSpringHours.nds and publishes it to the "nds-latest" release.
name: Build NDS
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    paths: ["nds/**", "3ds/js/**", "3ds/source/**", "3ds/third_party/**", "assets/**", "js/**", ".github/workflows/build-nds.yml"]
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          pip install pillow numpy
          sudo apt-get install -y fonts-dejavu-core >/dev/null
      - name: Story bundle + DS-sized pictures and font
        run: |
          node 3ds/tools/bundle_story.js
          python3 3ds/tools/build_assets.py 3ds/build/gfx
          mkdir -p nds/build_assets && cp 3ds/romfs/story.js nds/build_assets/story.js
          python3 nds/tools/build_assets_ds.py 3ds/build/gfx nds/build_assets /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - uses: actions/upload-artifact@v4
        with: { name: nds-assets, path: nds/build_assets }
  build:
    needs: assets
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: nds-assets, path: nds/nitrofs }
      - name: Build
        run: |
          make -C nds -j2
          python3 nds/tools/patch_nds.py nds/OurSpringHours.nds || echo "python3 missing in container?"
      - name: Size report
        run: |
          ls -l nds/*.nds
          $WONDERFUL_TOOLCHAIN/toolchain/gcc-arm-none-eabi/bin/arm-none-eabi-size nds/build/*.elf
          $WONDERFUL_TOOLCHAIN/toolchain/gcc-arm-none-eabi/bin/arm-none-eabi-readelf -lW nds/build/*.elf | head -30
      - name: Publish to the "nds-latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nds-latest
          name: DS build (latest)
          prerelease: true
          body: "Automatic build of the Nintendo DS port. Load OurSpringHours.nds in NDSWeb / any DS emulator or flashcart. See nds/README.md."
          files: |
            nds/OurSpringHours.nds
            nds/build/OurSpringHours.elf
