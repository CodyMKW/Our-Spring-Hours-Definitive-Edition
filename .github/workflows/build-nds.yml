# Builds the Nintendo DS port (nds/) with BlocksDS into OurSpringHours.nds and publishes it to the "nds-latest" release.
name: Build NDS
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    paths: ["nds/**", "3ds/js/**", "3ds/source/**", "3ds/third_party/**", "assets/**", "js/**", ".github/workflows/build-nds.yml"]
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pip install pillow
      - name: Story bundle
        run: |
          node 3ds/tools/bundle_story.js
          mkdir -p nds/build_assets && cp 3ds/romfs/story.js nds/build_assets/story.js
      - uses: actions/upload-artifact@v4
        with: { name: nds-assets, path: nds/build_assets }
  build:
    needs: assets
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: nds-assets, path: nds/nitrofs }
      - name: Show rest of template makefile
        run: sed -n 150,330p $BLOCKSDS/sys/default_makefiles/rom_arm9/Makefile
      - name: Probes (liveness experiments)
        run: |
          mkdir -p probe && cp -r nds probe_src
          for n in 1 7; do
            rm -rf probe_src/build; make -C probe_src -j2 NAME=T$n EXTRA="-DPROBE=$n -DPROBE_ONLY" >/dev/null 2>&1 || echo "probe T$n failed"
            cp probe_src/T$n.nds probe/ || true; cp probe_src/build/T$n.elf probe/ || true
          done
          ls -l probe
      - name: Build
        run: make -C nds -j2 ARCH="-marm -mcpu=arm946e-s+nofp"
      - name: Size report
        run: |
          ls -l nds/*.nds
          $WONDERFUL_TOOLCHAIN/toolchain/gcc-arm-none-eabi/bin/arm-none-eabi-size nds/build/*.elf
          $WONDERFUL_TOOLCHAIN/toolchain/gcc-arm-none-eabi/bin/arm-none-eabi-readelf -lW nds/build/*.elf | head -30
      - name: Publish to the "nds-latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nds-latest
          name: DS build (latest)
          prerelease: true
          body: "Automatic build of the Nintendo DS port. Load OurSpringHours.nds in NDSWeb / any DS emulator or flashcart. See nds/README.md."
          files: |
            nds/OurSpringHours.nds
            nds/build/OurSpringHours.elf
            probe/T1.nds
            probe/T1.elf
            probe/T7.nds
            probe/T7.elf
